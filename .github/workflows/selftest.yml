# Weekly self-test of the live site: tests on main, live pages and indexing, data freshness (dispatches the refresh
# when data is stale, so a skipped schedule heals itself), the live end-to-end run, then the keep-alive.
name: Self-test

on:
  schedule:
    - cron: "53 6 * * 4"    # Thursdays 06:53 UTC
    - cron: "17,47 * 22,23 11 *"   # TEMPORARY: proves the schedule trigger on 22-23 Nov 2026; remove after it fires
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
  SITE_INDEXABLE: ${{ vars.SITE_INDEXABLE || 'true' }}

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Tests on main
        run: |
          python -m unittest discover -s tests -t .
          node --test tests/js.test.mjs
      - name: Live pages, indexing and freshness
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/health.py "$SITE_URL"
      - name: Live end-to-end run
        run: scripts/e2e.sh "$SITE_URL/"

  keepalive:
    needs: live
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Keep scheduled workflows enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/keepalive.sh
